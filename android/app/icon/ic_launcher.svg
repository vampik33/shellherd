<?xml version="1.0" encoding="UTF-8"?>
<!-- The launcher icon for Android 7, which has no adaptive icons: the
     drawing of res/drawable/ic_launcher_foreground.xml on a rounded square.
     Render the PNGs in res/mipmap-*dpi with:
       for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
         rsvg-convert -w ${s#*:} -h ${s#*:} android/app/icon/ic_launcher.svg \
           -o android/app/src/main/res/mipmap-${s%:*}/ic_launcher.png
       done -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#17191D"/>
  <g transform="translate(12 12) scale(0.72) translate(-12 -12)" fill="none" stroke-width="2">
    <path d="M5,4.5 H19 A2,2 0 0 1 21,6.5 V17.5 A2,2 0 0 1 19,19.5 H5 A2,2 0 0 1 3,17.5 V6.5 A2,2 0 0 1 5,4.5 Z" stroke="#96B2D7"/>
    <path d="M7,9 L10,12 L7,15" stroke="#8CBDC3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12,15 H17" stroke="#8CBDC3" stroke-linecap="round"/>
  </g>
</svg>
